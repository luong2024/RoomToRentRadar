<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="wall1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF3FF"/>
      <stop offset="100%" stop-color="#DCE9FA"/>
    </linearGradient>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="bed1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#wall1)"/>
  <rect y="365" width="800" height="135" fill="#D5E2F2"/>
  <!-- Sunlit Panoramic Window -->
  <rect x="210" y="55" width="380" height="235" rx="22" fill="#FFFFFF" opacity="0.92"/>
  <rect x="226" y="71" width="348" height="203" rx="14" fill="url(#sky1)"/>
  <line x1="400" y1="71" x2="400" y2="274" stroke="#FFFFFF" stroke-width="6"/>
  <!-- Diagonal Sunlight Sheen -->
  <polygon points="226,71 360,71 280,274 226,274" fill="#FFFFFF" opacity="0.45"/>
  <!-- Modern Low Bed & Pillows -->
  <rect x="175" y="312" width="450" height="86" rx="22" fill="url(#bed1)"/>
  <rect x="215" y="282" width="130" height="42" rx="14" fill="#FFFFFF"/>
  <rect x="365" y="286" width="120" height="38" rx="14" fill="#7DD3FC"/>
  <!-- Glass Pendant Light -->
  <line x1="650" y1="0" x2="650" y2="130" stroke="#64748B" stroke-width="3"/>
  <circle cx="650" cy="152" r="26" fill="#FFFFFF" opacity="0.88"/>
</svg>
