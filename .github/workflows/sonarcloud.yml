name: Quality - SonarCloud Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for SonarCloud Configuration
        id: check-secrets
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::SonarCloud is not configured. Secret 'SONAR_TOKEN' is missing."
            echo "::notice::To enable SonarCloud code quality scans, add SONAR_TOKEN, SONAR_ORGANIZATION, and SONAR_PROJECT_KEY under Repository Settings -> Secrets and variables -> Actions."
            echo "::notice::See docs/CI-CD.md for setup instructions."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java 21 (JDK for SonarScanner)
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup .NET SDK
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install .NET MAUI Android Workload
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          dotnet workload install maui-android

      - name: Cache SonarCloud Packages
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install dotnet-sonarscanner
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner || dotnet tool update --global dotnet-sonarscanner

      - name: Begin SonarCloud Analysis
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION || 'luong2024' }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY || 'luong2024_RoomToRentRadar' }}
        run: |
          dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"

      - name: Build & Run Tests with Coverage for SonarCloud
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          dotnet restore RoomToRentRadarUnitTests/RoomToRentRadarUnitTests.csproj
          dotnet restore RoomToRentRadarUIAppiumTests/RoomToRentRadarUIAppiumTests.csproj
          dotnet restore RoomToRentRadar/RoomToRentRadar.csproj

          dotnet test RoomToRentRadarUnitTests/RoomToRentRadarUnitTests.csproj \
            --configuration Release \
            --no-restore \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --results-directory ./TestResults

          dotnet build RoomToRentRadar/RoomToRentRadar.csproj \
            --configuration Release \
            --framework net10.0-android \
            --no-restore \
            -p:TargetFrameworks=net10.0-android

      - name: End SonarCloud Analysis
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
