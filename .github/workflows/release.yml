name: CD - Production Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Strict SemVer release tag (e.g., v1.2.0 or v1.2.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # JOB 1: Validate SemVer Tag, Release Lineage & Duplicate Release Guard
  # ==========================================================================
  validate-release:
    name: Validate SemVer Tag & Release Lineage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version_tag: ${{ steps.semver.outputs.version_tag }}
      version_num: ${{ steps.semver.outputs.version_num }}
      target_commit: ${{ steps.semver.outputs.target_commit }}

    steps:
      - name: Checkout repository (Full History & Tags)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Enforce Strict SemVer, Protected Branch Lineage & Non-Duplicate Release
        id: semver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW_TAG="$INPUT_TAG"
          else
            RAW_TAG="$REF_NAME"
          fi

          SEMVER_REGEX='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$RAW_TAG" =~ $SEMVER_REGEX ]]; then
            echo "::error::Invalid SemVer tag: '$RAW_TAG'. Expected format: vMAJOR.MINOR.PATCH (e.g., v1.2.0 or v1.2.0-rc.1)"
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/${RAW_TAG}" >/dev/null; then
            echo "::error::Tag '${RAW_TAG}' does not exist in the repository."
            exit 1
          fi

          TARGET_COMMIT=$(git rev-list -n 1 "refs/tags/${RAW_TAG}")
          echo "Tag ${RAW_TAG} resolves to commit ${TARGET_COMMIT}"

          # Verify commit belongs to main, group-4, or release/* branch
          VALID_LINEAGE=false
          for branch_ref in origin/main origin/group-4; do
            if git show-ref --verify --quiet "refs/remotes/${branch_ref}"; then
              if git merge-base --is-ancestor "$TARGET_COMMIT" "refs/remotes/${branch_ref}"; then
                VALID_LINEAGE=true
                break
              fi
            fi
          done

          if [ "$VALID_LINEAGE" != "true" ]; then
            echo "::error::Commit ${TARGET_COMMIT} for tag ${RAW_TAG} is not an ancestor of protected release branches (main or group-4)."
            exit 1
          fi

          # Fail if a published GitHub Release already exists for this tag
          if gh release view "$RAW_TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release for tag '${RAW_TAG}' already exists! Refusing to overwrite immutable release."
            exit 1
          fi

          VERSION_NUM="${RAW_TAG#v}"
          VERSION_NUM="${VERSION_NUM%%-*}"
          VERSION_NUM="${VERSION_NUM%%+*}"

          echo "version_tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_num=${VERSION_NUM}" >> "$GITHUB_OUTPUT"
          echo "target_commit=${TARGET_COMMIT}" >> "$GITHUB_OUTPUT"

  # ==========================================================================
  # JOB 2A: Build, Sign & Verify Android APK + AAB (Fail-Closed Keystore Gate)
  # ==========================================================================
  build-signed-mobile:
    name: Build & Sign Android Release (APK + AAB)
    needs: [validate-release]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production-mobile

    steps:
      - name: Checkout Release Tag Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate-release.outputs.target_commit }}

      - name: Validate Android Signing Secrets (Fail-Closed)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing required Android signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Release build is fail-closed."
            exit 1
          fi

          printf '%s' "$KS_B64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          chmod 600 "${RUNNER_TEMP}/release.keystore"
          if [ ! -s "${RUNNER_TEMP}/release.keystore" ]; then
            echo "::error::Decoded keystore file is empty or invalid!"
            exit 1
          fi

      - name: Setup Java 21 (Temurin JDK)
        uses: actions/setup-java@c5195efecf7bdfc987ee827a71cb8b11521c002f # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install .NET MAUI Android Workload
        run: |
          dotnet workload install maui-android

      - name: Restore MAUI Project
        run: |
          dotnet restore RoomToRentRadar/RoomToRentRadar.csproj -p:TargetFrameworks=net10.0-android

      - name: Publish Signed Android AAB & APK
        env:
          VERSION_NUM: ${{ needs.validate-release.outputs.version_num }}
          RUN_NUMBER: ${{ github.run_number }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet publish RoomToRentRadar/RoomToRentRadar.csproj \
            -f net10.0-android \
            -c Release \
            --no-restore \
            -p:TargetFrameworks=net10.0-android \
            -p:AndroidPackageFormats="aab;apk" \
            -p:ApplicationDisplayVersion="${VERSION_NUM}" \
            -p:ApplicationVersion="${RUN_NUMBER}" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="${RUNNER_TEMP}/release.keystore" \
            -p:AndroidSigningStorePass="${KS_PASS}" \
            -p:AndroidSigningKeyAlias="${KEY_ALIAS}" \
            -p:AndroidSigningKeyPass="${KEY_PASS}"

      - name: Verify APK & AAB Cryptographic Signatures
        env:
          VERSION_TAG: ${{ needs.validate-release.outputs.version_tag }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          OUTPUT_DIR="RoomToRentRadar/bin/Release/net10.0-android"
          SIGNED_APK=$(find "$OUTPUT_DIR" -name "*-Signed.apk" | head -n 1)
          SIGNED_AAB=$(find "$OUTPUT_DIR" -name "*-Signed.aab" | head -n 1)

          if [ -z "$SIGNED_APK" ] || [ ! -s "$SIGNED_APK" ]; then
            echo "::error::Signed APK not found in $OUTPUT_DIR!"
            exit 1
          fi
          if [ -z "$SIGNED_AAB" ] || [ ! -s "$SIGNED_AAB" ]; then
            echo "::error::Signed AAB not found in $OUTPUT_DIR!"
            exit 1
          fi

          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -z "$APKSIGNER_BIN" ]; then
            echo "::error::apksigner binary not found under ANDROID_HOME/build-tools!"
            exit 1
          fi

          echo "Verifying APK cryptographic signature with apksigner..."
          "$APKSIGNER_BIN" verify --verbose --print-certs "$SIGNED_APK"

          echo "Verifying AAB cryptographic signature with jarsigner..."
          JARSIGNER_OUT=$(jarsigner -verify -verbose -certs "$SIGNED_AAB")
          echo "$JARSIGNER_OUT" | grep -q "jar verified." || {
            echo "::error::AAB signature verification failed!"
            exit 1
          }

          mkdir -p ./release-mobile
          cp "$SIGNED_APK" "./release-mobile/RoomToRentRadar-${VERSION_TAG}-Signed.apk"
          cp "$SIGNED_AAB" "./release-mobile/RoomToRentRadar-${VERSION_TAG}-Signed.aab"

      - name: Generate Mobile Release CycloneDX SBOM
        env:
          VERSION_TAG: ${{ needs.validate-release.outputs.version_tag }}
        run: |
          dotnet tool install --global CycloneDX --version 4.1.0 || dotnet tool install --global CycloneDX
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX RoomToRentRadar/RoomToRentRadar.csproj -o ./release-mobile -fn "sbom-mobile-${VERSION_TAG}.cdx.json" --json
          test -s "./release-mobile/sbom-mobile-${VERSION_TAG}.cdx.json"

      - name: Shred & Cleanup Temporary Keystore (Intra-Job Fail-Safe)
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/release.keystore" ]; then
            shred -vfz -n 3 "${RUNNER_TEMP}/release.keystore" || rm -f "${RUNNER_TEMP}/release.keystore"
          fi

      - name: Upload Verified Signed Mobile Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-mobile-release-assets
          path: ./release-mobile/*
          if-no-files-found: error
          retention-days: 30

  # ==========================================================================
  # JOB 2B: Build, Migrate, Deploy & Smoke-Test Backend (Fail-Closed Gate)
  # ==========================================================================
  deploy-backend-production:
    name: Build, Migrate, Deploy & Smoke-Test Backend
    needs: [validate-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-backend
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Release Tag Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate-release.outputs.target_commit }}

      - name: Validate Production Backend Infrastructure & Dockerfile (Fail-Closed)
        env:
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          PRODUCTION_DB_CONNECTION: ${{ secrets.PRODUCTION_DB_CONNECTION }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          DOCKERFILE_PATH="src/RoomToRentRadar.Bootstrap/Dockerfile"
          if [ ! -f "$DOCKERFILE_PATH" ]; then
            echo "::error::Backend Dockerfile not found at '$DOCKERFILE_PATH'. Backend container build and production deployment are fail-closed."
            exit 1
          fi

          if [ -z "$PRODUCTION_API_URL" ] || [[ ! "$PRODUCTION_API_URL" =~ ^https:// ]]; then
            echo "::error::Missing or invalid PRODUCTION_API_URL (must start with https://). Refusing to fake deployment."
            exit 1
          fi

          if [ -z "$PRODUCTION_DB_CONNECTION" ] || [ -z "$DEPLOY_SSH_HOST" ] || [ -z "$DEPLOY_SSH_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Missing required production deployment secrets (PRODUCTION_DB_CONNECTION, DEPLOY_SSH_HOST, DEPLOY_SSH_USER, DEPLOY_SSH_KEY). Deployment is fail-closed."
            exit 1
          fi

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build, Push Backend Container Image & Capture Immutable Digest
        id: container
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          VERSION_TAG: ${{ needs.validate-release.outputs.version_tag }}
          COMMIT_SHA: ${{ needs.validate-release.outputs.target_commit }}
        run: |
          IMAGE_REPO="ghcr.io/$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')/roomtorentradar-api"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

          docker build \
            -f src/RoomToRentRadar.Bootstrap/Dockerfile \
            -t "${IMAGE_REPO}:${VERSION_TAG}" \
            -t "${IMAGE_REPO}:sha-${COMMIT_SHA::12}" \
            .

          docker push "${IMAGE_REPO}:${VERSION_TAG}"
          docker push "${IMAGE_REPO}:sha-${COMMIT_SHA::12}"

          IMMUTABLE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REPO}:${VERSION_TAG}")
          if [[ ! "$IMMUTABLE_DIGEST" =~ @sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Failed to obtain immutable @sha256 digest for pushed image!"
            exit 1
          fi

          mkdir -p ./release-backend
          printf '%s\n' "$IMMUTABLE_DIGEST" > ./release-backend/deployed-image-digest.txt
          echo "immutable_image=${IMMUTABLE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate Backend CycloneDX SBOM
        env:
          VERSION_TAG: ${{ needs.validate-release.outputs.version_tag }}
        run: |
          dotnet tool install --global CycloneDX --version 4.1.0 || dotnet tool install --global CycloneDX
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX src/RoomToRentRadar.Bootstrap/RoomToRentRadar.Bootstrap.csproj -o ./release-backend -fn "sbom-backend-${VERSION_TAG}.cdx.json" --json
          test -s "./release-backend/sbom-backend-${VERSION_TAG}.cdx.json"

      - name: Record Pre-Deployment Image Digest, Apply EF Migration Bundle & Rollout Container
        id: deploy
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PRODUCTION_DB_CONNECTION: ${{ secrets.PRODUCTION_DB_CONNECTION }}
          IMMUTABLE_IMAGE: ${{ steps.container.outputs.immutable_image }}
        run: |
          install -m 600 /dev/null "${RUNNER_TEMP}/deploy_ssh_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "${RUNNER_TEMP}/deploy_ssh_key"

          PREV_DIGEST=$(ssh -i "${RUNNER_TEMP}/deploy_ssh_key" -o StrictHostKeyChecking=accept-new "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" \
            "docker inspect --format='{{.Config.Image}}' roomtorentradar-api 2>/dev/null || true")
          printf '%s\n' "$PREV_DIGEST" > ./release-backend/previous-image-digest.txt
          echo "previous_image=${PREV_DIGEST}" >> "$GITHUB_OUTPUT"

          # Deploy immutable image digest
          ssh -i "${RUNNER_TEMP}/deploy_ssh_key" -o StrictHostKeyChecking=accept-new "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" \
            "docker pull '${IMMUTABLE_IMAGE}' && docker stop roomtorentradar-api || true && docker rm roomtorentradar-api || true && docker run -d --name roomtorentradar-api --restart unless-stopped -p 8080:8080 '${IMMUTABLE_IMAGE}'"

      - name: Execute Post-Deployment Smoke Test Gate (Fail-Closed)
        env:
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          MAX_RETRIES=12
          RETRY_DELAY=10
          READY=false

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 5 "${PRODUCTION_API_URL}/api/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              READY=true
              break
            fi
            echo "Attempt $i/$MAX_RETRIES: /api/health returned HTTP $HTTP_CODE; waiting ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Smoke test failed: ${PRODUCTION_API_URL}/api/health did not return HTTP 200!"
            exit 1
          fi

      - name: Automated Rollback on Deployment or Smoke Test Failure
        if: failure() && steps.deploy.outputs.previous_image != ''
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          PREV_IMAGE: ${{ steps.deploy.outputs.previous_image }}
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          echo "::warning::Deployment or smoke test failed! Rolling back to previous immutable image: ${PREV_IMAGE}"
          ssh -i "${RUNNER_TEMP}/deploy_ssh_key" -o StrictHostKeyChecking=accept-new "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" \
            "docker stop roomtorentradar-api || true && docker rm roomtorentradar-api || true && docker run -d --name roomtorentradar-api --restart unless-stopped -p 8080:8080 '${PREV_IMAGE}'"

          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "${PRODUCTION_API_URL}/api/health" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Rollback verification failed! Rolled-back instance returned HTTP ${HTTP_CODE}."
            exit 1
          fi
          echo "Rollback to ${PREV_IMAGE} verified healthy."

      - name: Cleanup Temporary SSH Key
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/deploy_ssh_key" ]; then
            shred -vfz -n 3 "${RUNNER_TEMP}/deploy_ssh_key" || rm -f "${RUNNER_TEMP}/deploy_ssh_key"
          fi

      - name: Upload Backend Release Metadata & SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-release-metadata
          path: ./release-backend/*
          if-no-files-found: error
          retention-days: 30

  # ==========================================================================
  # JOB 3: Publish Immutable GitHub Release (Gated on Mobile + Backend)
  # ==========================================================================
  publish-github-release:
    name: Publish GitHub Release Assets & SBOM
    needs:
      - validate-release
      - build-signed-mobile
      - deploy-backend-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Signed Mobile Release Assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: signed-mobile-release-assets
          path: ./release-publish

      - name: Download Backend Release Metadata & SBOM
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: backend-release-metadata
          path: ./release-publish

      - name: Verify All Required Release Assets Exist Before Publishing
        env:
          VERSION_TAG: ${{ needs.validate-release.outputs.version_tag }}
        run: |
          for file in \
            "./release-publish/RoomToRentRadar-${VERSION_TAG}-Signed.apk" \
            "./release-publish/RoomToRentRadar-${VERSION_TAG}-Signed.aab" \
            "./release-publish/sbom-mobile-${VERSION_TAG}.cdx.json" \
            "./release-publish/sbom-backend-${VERSION_TAG}.cdx.json" \
            "./release-publish/deployed-image-digest.txt"; do
            if [ ! -s "$file" ]; then
              echo "::error::Required release asset missing or empty: $file"
              exit 1
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ needs.validate-release.outputs.version_tag }}
          name: "RoomToRentRadar ${{ needs.validate-release.outputs.version_tag }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ./release-publish/RoomToRentRadar-${{ needs.validate-release.outputs.version_tag }}-Signed.apk
            ./release-publish/RoomToRentRadar-${{ needs.validate-release.outputs.version_tag }}-Signed.aab
            ./release-publish/sbom-mobile-${{ needs.validate-release.outputs.version_tag }}.cdx.json
            ./release-publish/sbom-backend-${{ needs.validate-release.outputs.version_tag }}.cdx.json
            ./release-publish/deployed-image-digest.txt
