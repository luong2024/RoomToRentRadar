name: RoomToRentRadar CI

on:
  push:
    branches:
      - group-1
      - main
      - 'feature/**'
      - 'fix/**'
      - 'ci/**'
      - 'chore/**'
  pull_request:
    branches:
      - group-1
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Restore API tests
        run: dotnet restore RoomToRentRadar.Api.Tests/RoomToRentRadar.Api.Tests.csproj

      - name: Build API tests
        run: dotnet build RoomToRentRadar.Api.Tests/RoomToRentRadar.Api.Tests.csproj --configuration Release --no-restore

      - name: Run API tests
        run: >
          dotnet test RoomToRentRadar.Api.Tests/RoomToRentRadar.Api.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=api-tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results-${{ github.run_number }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7

  mobile-android:
    name: MAUI Android
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore mobile projects
        run: |
          dotnet restore RoomToRentRadar/RoomToRentRadar.csproj
          dotnet restore RoomToRentRadarUnitTests/RoomToRentRadarUnitTests.csproj

      - name: Run mobile unit tests
        run: >
          dotnet test RoomToRentRadarUnitTests/RoomToRentRadarUnitTests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=mobile-unit-tests.trx"
          --results-directory TestResults

      - name: Build Android APK
        run: >
          dotnet build RoomToRentRadar/RoomToRentRadar.csproj
          --configuration Release
          --framework net10.0-android
          --no-restore
          -p:AndroidPackageFormat=apk

      - name: Locate APK
        id: apk
        run: |
          OUTPUT_DIR="RoomToRentRadar/bin/Release/net10.0-android"
          APK_FILE=$(find "$OUTPUT_DIR" -maxdepth 2 -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK found in $OUTPUT_DIR"
            ls -la "$OUTPUT_DIR" || true
            exit 1
          fi
          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomToRentRadar-Android-${{ github.run_number }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload mobile test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results-${{ github.run_number }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7

  mobile-windows:
    name: MAUI Windows
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Restore mobile project
        run: >
          dotnet restore RoomToRentRadar/RoomToRentRadar.csproj
          -p:TargetFrameworks=net10.0-windows10.0.19041.0

      - name: Build Windows app
        run: >
          dotnet build RoomToRentRadar/RoomToRentRadar.csproj
          --configuration Release
          --framework net10.0-windows10.0.19041.0
          --no-restore
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
