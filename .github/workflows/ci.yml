name: RoomToRentRadar CI (develop2)

on:
  push:
    branches:
      - develop2
      - 'feature/**'
      - 'fix/**'
      - 'us*/**'
  pull_request:
    branches:
      - develop2
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  api-and-unit-tests:
    name: Core, API & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          dotnet restore RoomToRentRadar.Api/RoomToRentRadar.Api.csproj
          dotnet restore RoomToRentRadarUnitTests/RoomToRentRadarUnitTests.csproj

      - name: Build Web API & Core Layers
        run: dotnet build RoomToRentRadar.Api/RoomToRentRadar.Api.csproj --configuration Release

      - name: Execute Unit Tests (NUnit)
        run: dotnet test RoomToRentRadarUnitTests/RoomToRentRadarUnitTests.csproj --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

  maui-client-build:
    name: MAUI Client Build (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install .NET MAUI Android Workload
        run: dotnet workload install maui-android

      - name: Restore MAUI Client
        run: dotnet restore RoomToRentRadar/RoomToRentRadar.csproj

      - name: Build MAUI Client (net10.0-android)
        run: dotnet build RoomToRentRadar/RoomToRentRadar.csproj -f net10.0-android --configuration Release

