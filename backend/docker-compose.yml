# =============================================================================
# RoomToRentRadar — backend (ASP.NET Core MVC Web API + SQLite) in Docker.
# Lives in backend/. The MAUI app (frontend/) runs separately and calls this API over HTTP:
#   Windows: http://localhost:8080      Android emulator: http://10.0.2.2:8080
#
# Run from backend/:  cd backend
# First time:  copy .env.example to .env (both in backend/) and set JWT_SIGNING_KEY (never commit .env)
# Start:       docker compose up --build -d
# Logs:        docker compose logs -f api
# Stop:        docker compose down          (add -v to also delete the database volume)
# =============================================================================

name: roomtorentradar

services:
  api:
    build:
      # Build from the repository root: the image needs global.json and Directory.Build.props from there.
      context: ..
      dockerfile: backend/RoomToRentRadar.Api/Dockerfile
    image: roomtorentradar-api:local
    container_name: roomtorentradar-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Database__Path: /app/data/AppSQLite.db3
      # Required: compose stops with this message if the key is missing from .env.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (at least 32 characters), see .env.example}
    volumes:
      # Named volume: the SQLite database survives "docker compose down" and image rebuilds.
      - api-data:/app/data
    healthcheck:
      # The runtime image has no curl; bash /dev/tcp only checks that the port accepts connections.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  api-data:
